---
- name: Deploy Dashboard
  hosts: vps_servers
  become: true

  tasks:
    - name: Check root folder
      ansible.builtin.file:
        path: /docker-apps/dashboard
        state: directory
        owner: jenda
        group: jenda
        mode: '0755'

    - name: Copy docker-compose
      ansible.builtin.copy:
        src: ../../docker-compose.yml
        dest: /docker-apps/dashboard/docker-compose.yml
        owner: jenda
        group: jenda
        mode: '0644'

    - name: Login to GitHub Container Registry
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ github_username }}"
        password: "{{ github_token }}"

    - name: Create secret .env file for Docker Compose
      ansible.builtin.copy:
        dest: /docker-apps/dashboard/.env
        content: |
          POSTGRES_USER={{ postgres_user }}
          POSTGRES_PASSWORD={{ postgres_password }}
          POSTGRES_DB={{ postgres_db }}
          JWT_SECRET_KEY={{ jwt_secret_key }}
          SECRET_KEY={{ secret_key }}
        owner: jenda
        group: jenda
        mode: '0600'

    - name: Update and restart Docker containers
      community.docker.docker_compose_v2:
        project_src: /docker-apps/dashboard/
        pull: always
        state: present