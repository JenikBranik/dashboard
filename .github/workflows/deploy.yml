name: Deploy via SSH
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: jenda
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projekty/muj-dashboard
            git pull || git clone https://github.com/${{ github.repository }}.git .
            sudo docker stop muj-web || true
            sudo docker rm muj-web || true
            sudo docker run -d --name muj-web -p 8081:80 -v $(pwd):/usr/share/nginx/html nginx:latest
